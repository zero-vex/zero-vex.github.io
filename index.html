<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Zen</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--gold:#c8a84b;--gold2:#e8c87a;--dim:#a09878;--panel:#0c0620;--stone:#5a4e70;--text:#e8dfc8;}
html,body{height:100%;overflow:hidden;}
body{font-family:'VT323',monospace;background:#060212;color:var(--text);image-rendering:pixelated;}
#sky{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,#050110 0%,#100825 35%,#1a0f3c 65%,#0b1528 100%);}
#stars{position:fixed;inset:0;z-index:1;pointer-events:none;}
.star{position:absolute;background:#fff;}
.tw{animation:tw 2s ease-in-out infinite;}
@keyframes tw{0%,100%{opacity:.1;}50%{opacity:1;}}
.moon{position:fixed;top:6vh;left:9vw;width:52px;height:52px;background:#f5e8b0;z-index:2;box-shadow:4px 4px 0 #d4c060,-2px -2px 0 #c8b040;animation:mf 7s ease-in-out infinite;}
.moon::before{content:'';position:absolute;top:10px;left:10px;width:6px;height:6px;background:#c8b040;}
.moon::after{content:'';position:absolute;top:22px;left:26px;width:10px;height:6px;background:#c8b040;}
@keyframes mf{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
.ff{position:fixed;width:4px;height:4px;background:#c8ff80;z-index:3;pointer-events:none;animation:ffa linear infinite;}
@keyframes ffa{0%{opacity:0;transform:translate(0,0);}15%{opacity:1;}50%{opacity:.7;transform:translate(var(--dx),var(--dy));}85%{opacity:.3;}100%{opacity:0;transform:translate(var(--dx2),var(--dy2));}}
#mts{position:fixed;bottom:0;left:0;right:0;width:100%;height:52vh;z-index:2;pointer-events:none;}
#hero{position:relative;z-index:10;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;text-align:center;padding:1.5rem;}
.greeting-box{background:rgba(4,1,14,.9);border:3px solid var(--gold);box-shadow:4px 4px 0 #000;padding:1.25rem 2rem;max-width:520px;width:100%;animation:fi .9s ease forwards;opacity:0;}
@keyframes fi{to{opacity:1;}}
#timeDisplay{font-family:'Press Start 2P',monospace;font-size:clamp(.55rem,1.6vw,.85rem);color:var(--gold2);letter-spacing:.1em;margin-bottom:.5rem;text-shadow:2px 2px 0 #000;}
#greeting{font-size:clamp(1rem,3.5vw,1.6rem);color:#c8ff80;text-shadow:2px 2px 0 #000;margin-bottom:.2rem;}
#greetLine{font-size:clamp(.8rem,2.2vw,.95rem);color:var(--dim);}
.site-title{font-family:'Press Start 2P',monospace;font-size:clamp(.8rem,3vw,1.7rem);color:var(--gold);text-shadow:3px 3px 0 #000,6px 6px 0 rgba(0,0,0,.4);animation:fi 1s .3s ease forwards;opacity:0;line-height:1.8;}
.hint-row{animation:fi 1s 1s ease forwards;opacity:0;display:flex;gap:8px;align-items:center;}
.hint-txt{font-size:.85rem;color:var(--dim);letter-spacing:.12em;}
.dots{display:flex;gap:5px;}
.dot{width:9px;height:9px;background:rgba(200,168,75,.15);border:2px solid rgba(200,168,75,.25);}
.dot.on{background:var(--gold);border-color:var(--gold2);box-shadow:0 0 6px var(--gold);}
.dot.err{background:#ff4040;border-color:#ff7070;}
#player{position:fixed;bottom:1.2rem;right:1.5rem;z-index:50;display:flex;align-items:center;gap:.6rem;background:rgba(4,1,14,.85);border:2px solid rgba(200,168,75,.35);padding:.4rem .8rem;font-size:.75rem;color:var(--dim);}
#player button{background:none;border:none;color:var(--gold);cursor:pointer;font-family:'VT323',monospace;font-size:1rem;}
#player button:hover{color:var(--gold2);}
#vol{width:60px;accent-color:var(--gold);}
.note{animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.4;}50%{opacity:1;}}
.ov{position:fixed;inset:0;z-index:100;background:rgba(3,1,10,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.25rem;opacity:0;pointer-events:none;transition:opacity .35s ease;overflow-y:auto;}
.ov.open{opacity:1;pointer-events:all;}
.panel{background:var(--panel);border:3px solid var(--gold);box-shadow:6px 6px 0 #000;padding:1.5rem 1.75rem;width:100%;max-width:700px;max-height:88vh;overflow-y:auto;}
.panel::-webkit-scrollbar{width:5px;}.panel::-webkit-scrollbar-track{background:#060212;}.panel::-webkit-scrollbar-thumb{background:var(--stone);}
.panel-title{font-family:'Press Start 2P',monospace;font-size:clamp(.5rem,1.7vw,.82rem);color:var(--gold);text-shadow:2px 2px 0 #000;margin-bottom:.9rem;text-align:center;line-height:2;}
.panel-sub{font-size:.9rem;color:var(--dim);text-align:center;margin-bottom:1.25rem;letter-spacing:.1em;}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:.6rem;}
.cat-btn{background:#130a22;border:2px solid var(--stone);color:var(--text);font-family:'VT323',monospace;font-size:1rem;padding:.55rem .4rem;cursor:pointer;text-align:center;box-shadow:3px 3px 0 #000;transition:all .12s;line-height:1.3;position:relative;}
.cat-btn:hover{background:#221540;border-color:var(--gold);color:var(--gold2);transform:translate(-1px,-1px);box-shadow:4px 4px 0 #000;}
.cat-btn.ai-btn{border-color:#5a9fff;color:#9fd0ff;}
.cat-btn.ai-btn:hover{background:#0a1a35;border-color:#9fd0ff;color:#d0e8ff;}
.ci{font-size:1.25rem;display:block;margin-bottom:.2rem;}
.cn{font-size:.65rem;color:var(--dim);margin-top:.12rem;}
.link-list{display:flex;flex-direction:column;gap:.42rem;margin-bottom:.8rem;}
.li{display:flex;align-items:center;gap:.65rem;background:#110920;border:2px solid var(--stone);padding:.52rem .75rem;text-decoration:none;color:var(--text);font-size:.98rem;box-shadow:3px 3px 0 #000;transition:all .12s;}
.li:hover{background:#1e0f3a;border-color:var(--gold);color:var(--gold2);transform:translateX(3px);}
.li.empty{opacity:.3;cursor:default;border-style:dashed;}
.lnum{font-family:'Press Start 2P',monospace;font-size:.44rem;color:var(--dim);min-width:20px;text-align:right;}
.lname{flex:1;}
.lbadge{font-size:.68rem;padding:1px 5px;border:1px solid;}
.ok{color:#80ff80;border-color:#80ff80;}.bl{color:#ff6060;border-color:#ff6060;}.ext{color:#80c8ff;border-color:#80c8ff;}
.back-btn{font-family:'VT323',monospace;font-size:1rem;background:transparent;border:2px solid var(--stone);color:var(--dim);padding:.32rem .85rem;cursor:pointer;box-shadow:2px 2px 0 #000;transition:all .12s;display:block;margin:0 auto;}
.back-btn:hover{border-color:var(--gold);color:var(--gold);}
.close-x{font-family:'Press Start 2P',monospace;font-size:.42rem;background:transparent;border:2px solid #3a1818;color:#ff6060;padding:.28rem .6rem;cursor:pointer;box-shadow:2px 2px 0 #000;transition:all .12s;display:block;margin:.55rem auto 0;}
.close-x:hover{border-color:#ff4040;background:#160404;}
#aiPanel .panel{max-width:760px;}
.ai-chat{display:flex;flex-direction:column;gap:.6rem;max-height:52vh;overflow-y:auto;margin-bottom:.8rem;padding:.5rem 0;}
.ai-chat::-webkit-scrollbar{width:4px;}.ai-chat::-webkit-scrollbar-thumb{background:var(--stone);}
.msg{padding:.55rem .8rem;font-size:1rem;line-height:1.5;max-width:88%;}
.msg.user{background:#1a0f35;border:1px solid #5a4e70;align-self:flex-end;}
.msg.ai{background:#080520;border:1px solid #2a5a8a;color:#c8e8ff;align-self:flex-start;}
.msg.ai .ai-name{font-family:'Press Start 2P',monospace;font-size:.42rem;color:#5a9fff;margin-bottom:.3rem;}
.ai-thinking{color:var(--dim);font-size:.85rem;animation:pulse 1.2s ease-in-out infinite;align-self:flex-start;padding:.4rem .6rem;}
.ai-input-row{display:flex;gap:.5rem;}
#aiInput{flex:1;background:#0a0618;border:2px solid var(--stone);color:var(--text);font-family:'VT323',monospace;font-size:1rem;padding:.45rem .7rem;outline:none;}
#aiInput:focus{border-color:var(--gold);}
#aiInput::placeholder{color:var(--dim);}
#aiSend{font-family:'Press Start 2P',monospace;font-size:.42rem;background:#0a1a35;border:2px solid #5a9fff;color:#9fd0ff;padding:.45rem .8rem;cursor:pointer;transition:all .12s;}
#aiSend:hover{background:#142a55;border-color:#9fd0ff;}
#aiSend:disabled{opacity:.4;cursor:not-allowed;}
.ai-notice{font-size:.72rem;color:var(--dim);text-align:center;margin-top:.5rem;line-height:1.6;}
.ai-notice a{color:#5a9fff;}
</style>
</head>

/* ═══════ RELÓGIO ═══════ */
function tick(){
  const n=new Date(),h=n.getHours(),m=n.getMinutes(),s=n.getSeconds();
  const p=x=>String(x).padStart(2,'0');
  document.getElementById('timeDisplay').textContent=`${p(h)}:${p(m)}:${p(s)}`;
  let gr,gl;
  if(h>=5&&h<12){gr="BOM DIA! ☀";gl="Que seu dia seja incrível";}
  else if(h>=12&&h<18){gr="BOA TARDE! 🌤";gl="Aproveite bem a tarde";}
  else if(h>=18&&h<22){gr="BOA NOITE! 🌙";gl="Uma noite tranquila para você";}
  else{gr="BOA MADRUGADA! 🌌";gl="Descanse quando puder...";}
  document.getElementById('greeting').textContent=gr;
  document.getElementById('greetLine').textContent=gl;
}
setInterval(tick,1000);tick();

/* ═══════ LOFI (Web Audio) ═══════ */
let audioCtx=null,masterGain=null,playing=false;
function buildLofi(){
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  masterGain=audioCtx.createGain();masterGain.gain.value=0;masterGain.connect(audioCtx.destination);
  const notes=[130.81,164.81,196,246.94,261.63];
  notes.forEach((freq,i)=>{
    const osc=audioCtx.createOscillator(),g=audioCtx.createGain(),filt=audioCtx.createBiquadFilter();
    const lfo=audioCtx.createOscillator(),lg=audioCtx.createGain();
    osc.type='sine';osc.frequency.value=freq;
    lfo.frequency.value=0.04+i*0.018;lg.gain.value=0.4;
    lfo.connect(lg);lg.connect(osc.frequency);lfo.start();
    filt.type='lowpass';filt.frequency.value=700;
    g.gain.value=0.045;
    osc.connect(filt);filt.connect(g);g.connect(masterGain);osc.start();
  });
  const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*3,audioCtx.sampleRate);
  const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1);
  const noise=audioCtx.createBufferSource();noise.buffer=buf;noise.loop=true;
  const nf=audioCtx.createBiquadFilter();nf.type='bandpass';nf.frequency.value=380;nf.Q.value=0.4;
  const ng=audioCtx.createGain();ng.gain.value=0.007;
  noise.connect(nf);nf.connect(ng);ng.connect(masterGain);noise.start();
}
function togglePlay(){
  if(!audioCtx)buildLofi();
  if(audioCtx.state==='suspended')audioCtx.resume();
  playing=!playing;
  const v=parseFloat(document.getElementById('vol').value);
  masterGain.gain.setTargetAtTime(playing?v:0,audioCtx.currentTime,.5);
  document.getElementById('playBtn').textContent=playing?'⏸':'▶';
  document.getElementById('playerLabel').textContent=playing?'♪ tocando...':'lofi zen';
}
function setVol(v){
  document.getElementById('volNum').textContent=Math.round(v*100)+'%';
  if(masterGain&&playing)masterGain.gain.setTargetAtTime(parseFloat(v),audioCtx.currentTime,.1);
}

function openCat(id){
  const c=CATS.find(x=>x.id===id);if(!c||!c.links)return;
  document.getElementById('m2title').textContent=`${c.icon} ${c.nome}`;
  document.getElementById('m2sub').textContent=c.desc;
  const ll=document.getElementById('linkList');ll.innerHTML='';
  c.links.forEach((lk,i)=>{
    const num=`<span class="lnum">${String(i+1).padStart(2,'0')}</span>`;
    const badgeLabel=lk.b==='bl'?'BLOQ':lk.b==='ext'?'EXT':'OK';
    const badge=`<span class="lbadge ${lk.b}">${badgeLabel}</span>`;
    if(lk.b==='bl'){
      const dv=document.createElement('div');dv.className='li empty';
      dv.innerHTML=`${num}<span class="lname">${lk.n}</span>${badge}`;ll.appendChild(dv);
    } else {
      const a=document.createElement('a');a.className='li';a.href=lk.u;a.target='_blank';a.rel='noopener noreferrer';
      a.innerHTML=`${num}<span class="lname">${lk.n}</span>${badge}`;ll.appendChild(a);
    }
  });
  document.getElementById('menu1').classList.remove('open');
  document.getElementById('menu2').classList.add('open');
}

/* ═══════ AI ═══════ */
let aiHistory=[];
function openAI(){
  document.getElementById('menu1').classList.remove('open');
  document.getElementById('aiPanel').classList.add('open');
  if(!aiHistory.length)addMsg('ai','Olá! Sou seu assistente integrado ao Portal Zen. Como posso ajudar?');
}
function addMsg(role,text){
  const chat=document.getElementById('aiChat');
  const d=document.createElement('div');d.className='msg '+role;
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  d.innerHTML=role==='ai'?`<div class="ai-name">▶ CLAUDE</div>${esc(text)}`:esc(text);
  chat.appendChild(d);chat.scrollTop=99999;
}
async function sendAI(){
  const inp=document.getElementById('aiInput'),msg=inp.value.trim();
  if(!msg)return;
  inp.value='';addMsg('user',msg);aiHistory.push({role:'user',content:msg});
  const btn=document.getElementById('aiSend');btn.disabled=true;
  const th=document.createElement('div');th.className='ai-thinking';th.textContent='pensando...';
  document.getElementById('aiChat').appendChild(th);document.getElementById('aiChat').scrollTop=99999;
  if(API_KEY==='SUA_CHAVE_AQUI'){
    th.remove();addMsg('ai','⚠ Insira sua chave API na variável API_KEY no código.');btn.disabled=false;return;
  }
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':API_KEY,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,
        system:'Você é um assistente pessoal integrado a um portal privado com tema zen e pixel art estilo Terraria. Responda em português, de forma concisa e útil.',
        messages:aiHistory})
    });
    const data=await res.json();th.remove();
    const reply=data.content?.[0]?.text||'Erro ao obter resposta.';
    aiHistory.push({role:'assistant',content:reply});addMsg('ai',reply);
  }catch(e){th.remove();addMsg('ai','Erro de conexão: '+e.message);}
  btn.disabled=false;
}

function goBack(){
  document.getElementById('menu2').classList.remove('open');
  document.getElementById('aiPanel').classList.remove('open');
  document.getElementById('menu1').classList.add('open');
}
function closeAll(){
  ['menu1','menu2','aiPanel'].forEach(id=>document.getElementById(id).classList.remove('open'));
  typed='';setDots(0,false);
}

/* ═══════ SENHA ═══════ */
let typed='';
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeAll();return;}
  const open=['menu1','menu2','aiPanel'].some(id=>document.getElementById(id).classList.contains('open'));
  if(open){if(e.target.id==='aiInput')return;return;}
  if(e.key.length!==1)return;
  typed+=e.key.toLowerCase();
  if(typed.length>SENHA.length)typed=typed.slice(-SENHA.length);
  let match=0;
  for(let i=1;i<=typed.length;i++){if(SENHA.startsWith(typed.slice(typed.length-i)))match=i;}
  if(typed===SENHA){setDots(SENHA.length,false);setTimeout(()=>document.getElementById('menu1').classList.add('open'),150);}
  else setDots(match,match<typed.length&&!SENHA.startsWith(typed));
});
